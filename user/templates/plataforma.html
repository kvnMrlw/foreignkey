<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">  
</head>
<body>

    <nav class="navbar">
  
  <ul class="links">
    <li><a href="{% url 'logout' %}">logout</a></li>
  </ul>
</nav>

    <div class="container">
        <h1>Cadastro de produtos: </h1>
    </div>
        <br>
    <div class="container">
        <form action="{% url 'plataforma' %}" method="POST">{% csrf_token %}
            <label for="produto">Produto</label>
            <input type="text" name="produto" id="produto" class="form-control" placeholder="Produto..." required>
                <br>
            <label for="preco">Preço</label>
            <input type="number" name="preco" id="preco" class="form-control" placeholder="Preço..." step="0.01" min="0" required>
                <br>
            <input type="submit" value="Enviar" class="btn btn-success">
        </form>     
    </div>

        <br>

    <div class="container">
        
        <table class="table">

            <thead>
                <tr>
                    <th scope="col" class="cor">nome</th>
                    <th scope="col" class="cor">preço</th>
                </tr>
            </thead>

            <tbody>
            {% for p in produto %}
                <tr>
                    <td>{{p.produto}}</th>
                    <td>{{p.preco}}</td>
                </tr>
            {%endfor%}
            </tbody>

        </table>

    </div>

    <style>
        h1{
            color: brown;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
